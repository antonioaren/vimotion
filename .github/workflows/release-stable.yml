# Stable release: push a tag like v1.2.0 on master.
#   git tag v1.2.0 && git push origin v1.2.0
name: Release (stable)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag $REF_NAME is not a stable vX.Y.Z tag"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "::warning::VERSION file says $FILE_VERSION but the tag is $REF_NAME; the tag wins."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    permissions:
      contents: write
      pull-requests: write
      models: read
    uses: ./.github/workflows/_build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: false
    secrets: inherit
