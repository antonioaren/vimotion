name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package (smoke test)
        run: |
          VERSION=0.0.0-ci.${{ github.run_number }} ./scripts/build_app.sh
          ./scripts/make_dmg.sh
          ls dist/vimotion.zip dist/vimotion.zip.sha256 dist/vimotion-0.0.0-ci.*.dmg
